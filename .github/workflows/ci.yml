name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ss_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SS_ENVIRONMENT_TYPE: dev
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_test
      SS_DEFAULT_ADMIN_USERNAME: admin
      SS_DEFAULT_ADMIN_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, pdo_mysql, mysqli
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: vendor/bin/phpunit -d memory_limit=512M

  phpcs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs

  js:
    name: JS lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Jest
        run: npm test

      - name: Build
        run: npm run build

      - name: Check client/dist is up to date
        run: |
          if ! git diff --quiet -- client/dist; then
            echo "::error::client/dist is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- client/dist
            exit 1
          fi
